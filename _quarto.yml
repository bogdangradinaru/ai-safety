project:
  type: website
  output-dir: _site

  render:
    - index.qmd
    - src/index.qmd
    - "src/part-1/*.md"
    - "src/part-2/*.md"
    - "src/part-3/*.md"
    - notebooks/index.qmd
    - notebooks/part-1/01-supervised-live-demo.qmd

  resources:
    - src/part-1/cnn-architecture-explorer.html
    - src/part-1/cnn-feature-explorer.html
    - src/part-1/training-widgets.js
    - notebooks/part-1/07-model-architectures.ipynb

website:
  title: "AI Safety for Autonomous Driving"

  site-url: "https://bogdangradinaru.github.io/ai-safety/"

  navbar:
    search: true
    left:
      - href: index.qmd
        text: Home
      - sidebar:lectures
      - sidebar:labs

  sidebar:
    - id: lectures
      title: "Lectures"
      style: docked
      collapse-level: 2
      contents:
        - src/index.qmd

        - section: "Part I — AI Fundamentals"
          contents:
            - src/part-1/01-introduction.md
            - src/part-1/02-learning-methods.md
            - src/part-1/03-model-architectures.md
            - src/part-1/04-automotive-applications.md
            - src/part-1/05-system-architectures.md
            - src/part-1/06-ai-deployment.md

        - section: "Part II — Autonomous Driving Data"
          contents:
            - src/part-2/07-public-datasets.md
            - src/part-2/08-dataset-formats.md
            - src/part-2/09-metadata-labels-annotations.md
            - src/part-2/10-data-quality-coverage-bias.md
            - src/part-2/11-data-collection-synthesis-augmentation.md

        - section: "Part III — Safety Principles and Standards"
          contents:
            - src/part-3/12-iso-26262.md
            - src/part-3/13-sotif-iso-21448.md
            - src/part-3/14-ai-safety-iso-8800.md
            - src/part-3/15-hazards-risks-scenarios.md

    - id: labs
      title: "Labs"
      style: docked
      collapse-level: 2
      contents:
        - notebooks/index.qmd

        - section: "Part I — AI Learning Methods"
          contents:
            - notebooks/part-1/01-supervised-live-demo.qmd
            - notebooks/part-1/02-unsupervised-clustering.ipynb
            - notebooks/part-1/03-self-supervised-lightly.ipynb            
            - notebooks/part-1/04-semi-supervised-pseudolabels.ipynb
            - notebooks/part-1/05-reinforcement-highwayenv.ipynb
            - notebooks/part-1/07-model-architectures.ipynb

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-copy: true
    page-navigation: true
    css: styles/widgets.css
