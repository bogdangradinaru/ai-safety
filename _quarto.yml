
project:
  type: website
  output-dir: _site

  render:
    - index.qmd
    - src/index.qmd
    - "src/part-1/*.md"
    - notebooks/index.qmd
    - notebooks/part-1/01-supervised-kitti-yolo.ipynb

website:
  title: "AI Safety for Autonomous Driving"

  site-url: "https://bogdangradinaru.github.io/ai-safety/"

  navbar:
    search: true
    left:
      - href: index.qmd
        text: Home
      - sidebar:lectures
      - sidebar:labs

  sidebar:
    - id: lectures
      title: "Lectures"
      style: docked
      collapse-level: 2
      contents:
        - src/index.qmd

        - section: "Part I — AI Fundamentals"
          contents:
            - src/part-1/01-introduction.md
            - src/part-1/02-learning-methods.md
            - src/part-1/03-model-architectures.md
            - src/part-1/04-automotive-applications.md
            - src/part-1/05-system-architectures.md
            - src/part-1/06-ai-deployment.md

    - id: labs
      title: "Labs"
      style: docked
      collapse-level: 2
      contents:
        - notebooks/index.qmd

        - section: "Part I — AI Learning Methods"
          contents:
            - notebooks/part-1/01-supervised-kitti-yolo.ipynb
            - notebooks/part-1/02-unsupervised-clustering.ipynb
            - notebooks/part-1/03-self-supervised-lightly.ipynb            
            - notebooks/part-1/04-semi-supervised-pseudolabels.ipynb
            - notebooks/part-1/05-reinforcement-highwayenv.ipynb

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-copy: true
    page-navigation: true
